<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عارض المحاضرات الاحترافي - تكنو مسار</title>
    <!-- مكتبة PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* شاشة اختيار الدور */
        #role-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            text-align: center;
        }

        .role-card {
            background: var(--card-bg);
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            margin: 12px;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .role-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .role-card p { color: var(--text-muted); font-size: 0.9rem; }

        /* واجهة التلفزيون (شاشة العرض) */
        #tv-display-view {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #pdf-render-area {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }

        #blackout-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 50;
            display: none;
        }

        .tv-page-badge {
            position: absolute;
            bottom: 15px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 60;
            pointer-events: none;
        }

        /* واجهة ريموت الهاتف */
        #phone-remote-view {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .remote-panel {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }

        input[type="number"], button {
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0b0f19;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        button {
            background: var(--accent);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.97); }
        button:hover { background: var(--accent-hover); }

        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-secondary { background: #334155; }

        .remote-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .span-2 { grid-column: span 2; }

        .remote-btn {
            padding: 18px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
        }
        .status-on { background: rgba(22, 163, 74, 0.15); color: var(--success); }

        .file-input-box {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
        }

        .file-input-box input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة اختيار الدور الأولية -->
    <div id="role-screen">
        <h1 style="margin-bottom: 10px; color: var(--accent);">عارض المحاضرات الاحترافي</h1>
        <p style="color: var(--text-muted); margin-bottom: 25px;">اختر وضع الاستخدام لهذا الجهاز:</p>
        
        <div class="role-card" onclick="setAppRole('controller')">
            <h2>📱 الهاتف (ريموت التحكم)</h2>
            <p>اختر هذا الخيار من هاتفك لفتح ملف الـ PDF وإرسال الأوامر.</p>
        </div>

        <div class="role-card" onclick="setAppRole('display')">
            <h2>📺 التلفزيون (شاشة العرض)</h2>
            <p>اختر هذا الخيار من متصفح شاشة سامسونج لعرض المحاضرة.</p>
        </div>
    </div>

    <!-- 2. واجهة شاشة التلفزيون -->
    <div id="display-view">
        <div id="blackout-screen"></div>
        <div id="pdf-render-area">
            <canvas id="pdf-canvas"></canvas>
        </div>
        <div class="tv-page-badge" id="tv-page-badge">الصفحة: 0 / 0</div>
    </div>

    <!-- 3. واجهة ريموت الهاتف -->
    <div id="phone-remote-view">
        <div class="remote-panel" style="text-align: center;">
            <h3>وحدة التحكم (الريموت)</h3>
            <div class="status-badge status-on">متصل وجاهز للتحكم</div>
        </div>

        <div class="remote-panel">
            <div class="file-input-box">
                <button class="remote-btn btn-success span-2" style="width: 100%;">📁 اختيار ملف PDF للمحاضرة</button>
                <input type="file" id="pdf-selector" accept="application/pdf" onchange="processSelectedPdf(this)">
            </div>
            <div id="file-name-label" style="margin-top: 8px; font-size: 0.85rem; color: var(--text-muted); text-align: center;">لم يتم اختيار ملف</div>
        </div>

        <div class="remote-grid">
            <button class="remote-btn btn-secondary" onclick="sendRemoteCommand('prev_page')">⬅️ الصفحة السابقة</button>
            <button class="remote-btn btn-secondary" onclick="sendRemoteCommand('next_page')">الصفحة التالية ➡️</button>

            <button class="remote-btn btn-success span-2" onclick="sendRemoteCommand('show_page')">👁 إظهار الصفحة</button>
            <button class="remote-btn btn-danger span-2" onclick="sendRemoteCommand('hide_page')">🕶️ إخفاء الصفحة (شاشة سوداء)</button>

            <div class="span-2" style="display: flex; gap: 8px; align-items: center; background: #0b0f19; padding: 10px; border-radius: 10px; border: 1px solid #334155;">
                <input type="number" id="jump-page-input" placeholder="رقم" min="1" style="flex: 1; padding: 10px;">
                <button onclick="executeJump()" style="padding: 10px 16px;">الانتقال لصفحة</button>
            </div>

            <button class="remote-btn span-2" style="background: #1e293b; border: 1px solid #475569;">
                الصفحة الحالية: <span id="current-page-display" style="color: var(--accent); margin-right: 5px;">0</span> / <span id="total-pages-display">0</span>
            </button>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('technomasar_lecture_channel');
        let appRole = '';
        let loadedPdfDoc = null;
        let activePageNum = 1;
        let totalPagesCount = 0;
        let renderScale = 1.8;

        function setAppRole(role) {
            appRole = role;
            document.getElementById('role-screen').style.display = 'none';

            if (role === 'display') {
                document.getElementById('display-view').style.display = 'flex';
                // جلب آخر ملف تم فتحه إن وجد
                const savedPdf = localStorage.getItem('last_pdf_buffer');
                if (savedPdf) {
                    const bufferArray = JSON.parse(savedPdf);
                    loadPdfFromBuffer(new Uint8Array(bufferArray));
                }
            } else {
                document.getElementById('phone-remote-view').style.display = 'flex';
            }
        }

        // استقبال الأوامر في التلفزيون
        channel.onmessage = (event) => {
            const packet = event.data;
            if (appRole === 'display') {
                if (packet.action === 'load_pdf') {
                    loadPdfFromBuffer(new Uint8Array(packet.payload));
                } else if (packet.action === 'next_page') {
                    if (activePageNum < totalPagesCount) {
                        activePageNum++;
                        renderPdfPage(activePageNum);
                    }
                } else if (packet.action === 'prev_page') {
                    if (activePageNum > 1) {
                        activePageNum--;
                        renderPdfPage(activePageNum);
                    }
                } else if (packet.action === 'jump_page') {
                    let target = parseInt(packet.payload);
                    if (target >= 1 && target <= totalPagesCount) {
                        activePageNum = target;
                        renderPdfPage(activePageNum);
                    }
                } else if (packet.action === 'show_page') {
                    document.getElementById('blackout-screen').style.display = 'none';
                } else if (packet.action === 'hide_page') {
                    document.getElementById('blackout-screen').style.display = 'block';
                }
            } else if (appRole === 'controller') {
                if (packet.action === 'sync_meta') {
                    totalPagesCount = packet.payload.total;
                    activePageNum = packet.payload.current;
                    document.getElementById('current-page-display').innerText = activePageNum;
                    document.getElementById('total-pages-display').innerText = totalPagesCount;
                }
            }
        };

        function sendRemoteCommand(actionType, payloadData = null) {
            channel.postMessage({ action: actionType, payload: payloadData });
            // إذا كان الأمر في الهاتف، نحدث العدادات محلياً للاستجابة السريعة
            if (actionType === 'next_page' && activePageNum < totalPagesCount) activePageNum++;
            if (actionType === 'prev_page' && activePageNum > 1) activePageNum--;
            document.getElementById('current-page-display').innerText = activePageNum;
        }

        // معالجة ملفات PDF من الهاتف
        function processSelectedPdf(fileInput) {
            const selectedFile = fileInput.files[0];
            if (!selectedFile) return;

            document.getElementById('file-name-label').innerText = selectedFile.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                const rawBuffer = new Uint8Array(e.target.result);
                const bufferArray = Array.from(rawBuffer);
                
                // تخزين الملف مؤقتاً ليتزامن مع التلفزيون
                localStorage.setItem('last_pdf_buffer', JSON.stringify(bufferArray));

                pdfjsLib.getDocument(rawBuffer).promise.then(pdf => {
                    loadedPdfDoc = pdf;
                    totalPagesCount = pdf.numPages;
                    activePageNum = 1;
                    document.getElementById('current-page-display').innerText = activePageNum;
                    document.getElementById('total-pages-display').innerText = totalPagesCount;
                });

                sendRemoteCommand('load_pdf', bufferArray);
            };
            reader.readAsArrayBuffer(selectedFile);
        }

        function loadPdfFromBuffer(rawBuffer) {
            pdfjsLib.getDocument(rawBuffer).promise.then(pdf => {
                loadedPdfDoc = pdf;
                totalPagesCount = pdf.numPages;
                activePageNum = 1;
                renderPdfPage(activePageNum);
            });
        }

        function renderPdfPage(pageNum) {
            if (!loadedPdfDoc) return;
            loadedPdfDoc.getPage(pageNum).then(page => {
                const canvasEl = document.getElementById('pdf-canvas');
                const canvasCtx = canvasEl.getContext('2d');
                const pageViewport = page.getViewport({ scale: renderScale });

                canvasEl.height = pageViewport.height;
                canvasEl.width = pageViewport.width;

                page.render({
                    canvasContext: canvasCtx,
                    viewport: pageViewport
                });

                document.getElementById('tv-page-badge').innerText = `الصفحة: ${pageNum} / ${totalPagesCount}`;
                channel.postMessage({ action: 'sync_meta', payload: { total: totalPagesCount, current: pageNum } });
            });
        }

        function executeJump() {
            const inputVal = document.getElementById('jump-page-input').value;
            const targetPage = parseInt(inputVal);
            if (!targetPage || targetPage < 1) {
                alert('الرجاء إدخال رقم صفحة صحيح');
                return;
            }
            sendRemoteCommand('jump_page', targetPage);
        }
    </script>
</body>
</html>
