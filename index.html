<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عارض المحاضرات الاحترافي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#05080d;
    color:white;
    font-family:
        Tahoma,
        Arial,
        "Noto Kufi Arabic",
        sans-serif;
}

body{
    overflow:hidden;
}

button,input{
    font-family:inherit;
}

/* =========================
   شاشة التلفزيون
========================= */

#tvMode{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.top{
    height:60px;
    min-height:60px;
    background:#101722;
    border-bottom:1px solid #273446;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

#fileName{
    font-size:22px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#connectionStatus{
    font-size:15px;
    color:#7ee8a0;
}

#pdfContainer{
    flex:1;
    position:relative;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:15px;
    background:#070a0f;
}

#pdfCanvas{
    display:block;
    background:white;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
}

#startMessage{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#aeb9c8;
    font-size:25px;
    line-height:2;
}

#sentenceBox{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);

    width:min(92vw,1200px);

    padding:20px 30px;

    background:rgba(0,0,0,.82);

    border:2px solid rgba(255,255,255,.18);

    border-radius:18px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.7);

    text-align:center;

    font-size:clamp(25px,3.2vw,48px);

    line-height:1.8;

    color:white;

    direction:rtl;

    z-index:20;

    backdrop-filter:blur(8px);

    display:none;
}

#bottom{
    height:60px;
    min-height:60px;

    background:#101722;

    border-top:1px solid #273446;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:25px;

    color:#d5dde8;

    font-size:16px;
}

#choosePdf{
    background:#1687ff;
    color:white;
    border:0;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
   شاشة الهاتف
========================= */

#remoteMode{
    width:100%;
    height:100vh;

    overflow:auto;

    background:
        linear-gradient(
            145deg,
            #07111d,
            #0c1929
        );

    padding:20px;
}

.remoteCard{
    width:min(100%,520px);

    margin:0 auto;

    background:#111c2a;

    border:1px solid #2b3d53;

    border-radius:25px;

    padding:25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

.remoteTitle{
    text-align:center;
    margin-bottom:20px;
}

.remoteTitle h1{
    margin:0 0 8px;
    font-size:27px;
}

.remoteTitle p{
    margin:0;
    color:#aebaca;
    line-height:1.7;
}

label{
    display:block;
    margin:10px 0;
    color:#dce5ef;
}

#tvCode{
    width:100%;

    background:#09111b;

    border:1px solid #34485e;

    color:white;

    padding:16px;

    border-radius:13px;

    outline:none;

    font-size:20px;

    text-align:center;

    letter-spacing:4px;
}

.connect{
    width:100%;

    margin-top:12px;

    background:#1687ff;

    color:white;

    border:0;

    border-radius:13px;

    padding:15px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

#remoteStatus{
    text-align:center;
    margin:15px 0;
    color:#ffd166;
}

.controls{
    display:none;
}

.bigButton{
    width:100%;

    background:#19a957;

    color:white;

    border:0;

    border-radius:16px;

    padding:22px;

    font-size:26px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:12px;
}

.grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}

.control{
    border:0;

    border-radius:13px;

    padding:15px;

    background:#27374b;

    color:white;

    font-size:16px;

    cursor:pointer;
}

.control:active,
.bigButton:active,
.connect:active{
    transform:scale(.97);
}

.red{
    background:#d94352;
}

.zoomGrid{
    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:10px;

    margin-top:10px;
}

.info{
    background:#09111b;

    border:1px solid #26384d;

    border-radius:13px;

    padding:14px;

    margin-bottom:12px;

    text-align:center;

    color:#d4deea;

    line-height:1.8;
}

#remotePage{
    color:#75bfff;
}

#remoteSentence{
    color:#7ee8a0;
}

.hidden{
    display:none!important;
}

/* =========================
   الهاتف صغير
========================= */

@media(max-width:500px){

    .remoteCard{
        padding:18px;
    }

    .remoteTitle h1{
        font-size:23px;
    }

    .bigButton{
        font-size:22px;
        padding:20px;
    }

}
</style>
</head>

<body>

<!-- ==================================================
     وضع التلفزيون
================================================== -->

<div id="tvMode">

    <div class="top">

        <div id="fileName">
            عارض المحاضرات
        </div>

        <div id="connectionStatus">
            جاري تشغيل الريموت...
        </div>

    </div>


    <div id="pdfContainer">

        <canvas id="pdfCanvas"></canvas>

        <div id="startMessage">

            📄 اختر ملف PDF للبدء

            <br>

            ثم استخدم هاتفك كجهاز تحكم

        </div>

    </div>


    <div id="sentenceBox"></div>


    <div id="bottom">

        <button id="choosePdf">
            📄 اختيار PDF
        </button>

        <input
            type="file"
            id="pdfInput"
            accept="application/pdf"
            hidden
        >

        <span id="pageInfo">
            صفحة 0 / 0
        </span>

        <span id="sentenceInfo">
            جملة 0 / 0
        </span>

        <span id="zoomInfo">
            100%
        </span>

    </div>

</div>


<!-- ==================================================
     وضع الهاتف
================================================== -->

<div id="remoteMode" class="hidden">

    <div class="remoteCard">

        <div class="remoteTitle">

            <h1>
                📱 ريموت المحاضرات
            </h1>

            <p>
                استخدم الهاتف للتحكم في العرض الموجود على التلفزيون.
            </p>

        </div>


        <label>
            كود التلفزيون
        </label>

        <input
            id="tvCode"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="123456"
        >


        <button
            class="connect"
            id="connectButton"
        >
            🔗 اتصال بالتلفزيون
        </button>


        <div id="remoteStatus">
            غير متصل
        </div>


        <div
            class="controls"
            id="controls"
        >

            <div class="info">

                الصفحة:
                <b id="remotePage">
                    0
                </b>

                <br>

                الجملة:
                <b id="remoteSentence">
                    0 / 0
                </b>

            </div>


            <!-- الزر الأساسي -->

            <button
                class="bigButton"
                id="nextSentence"
            >
                ▶ الجملة التالية
            </button>


            <div class="grid">

                <button
                    class="control"
                    id="previousSentence"
                >
                    ◀ الجملة السابقة
                </button>


                <button
                    class="control"
                    id="nextPage"
                >
                    الصفحة التالية ▶
                </button>


                <button
                    class="control"
                    id="previousPage"
                >
                    ◀ الصفحة السابقة
                </button>


                <button
                    class="control red"
                    id="hideSentence"
                >
                    👁 إخفاء الجملة
                </button>

            </div>


            <div class="zoomGrid">

                <button
                    class="control"
                    id="zoomOut"
                >
                    − تصغير
                </button>


                <button
                    class="control"
                    id="resetZoom"
                >
                    100%
                </button>


                <button
                    class="control"
                    id="zoomIn"
                >
                    + تكبير
                </button>

            </div>


            <div class="info" style="margin-top:15px">

                💡 اضغط على
                <b>«الجملة التالية»</b>

                لإظهار جملة واحدة كاملة في كل ضغطة.

            </div>

        </div>

    </div>

</div>


<script>

/* ==================================================
   PDF.JS
================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* ==================================================
   العناصر
================================================== */

const tvMode =
document.getElementById("tvMode");

const remoteMode =
document.getElementById("remoteMode");

const pdfInput =
document.getElementById("pdfInput");

const choosePdf =
document.getElementById("choosePdf");

const canvas =
document.getElementById("pdfCanvas");

const ctx =
canvas.getContext("2d");

const sentenceBox =
document.getElementById("sentenceBox");

const startMessage =
document.getElementById("startMessage");


/* ==================================================
   معرفة هل الجهاز تلفزيون أم هاتف
================================================== */

const urlParams =
new URLSearchParams(window.location.search);

const remoteModeEnabled =
urlParams.get("remote") === "1";


if(remoteModeEnabled){

    tvMode.classList.add("hidden");

    remoteMode.classList.remove("hidden");

}


/* ==================================================
   بيانات البرنامج
================================================== */

let pdfDocument = null;

let currentPage = 1;

let currentScale = 1;

let sentences = [];

let currentSentence = -1;

let peer = null;

let connection = null;


/* ==================================================
   اختيار PDF
================================================== */

if(!remoteModeEnabled){

    choosePdf.onclick = function(){

        pdfInput.click();

    };


    pdfInput.onchange = async function(){

        const file =
        pdfInput.files[0];

        if(!file){
            return;
        }


        try{

            const buffer =
            await file.arrayBuffer();


            pdfDocument =
            await pdfjsLib.getDocument({
                data:buffer
            }).promise;


            currentPage = 1;

            currentScale = 1;


            document.getElementById("fileName")
                .textContent = file.name;


            startMessage.style.display =
            "none";


            await displayPage();


        }catch(error){

            alert(
                "تعذر فتح ملف PDF."
            );

            console.error(error);

        }

    };

}


/* ==================================================
   عرض الصفحة
================================================== */

async function displayPage(){

    if(!pdfDocument){
        return;
    }


    const page =
    await pdfDocument.getPage(
        currentPage
    );


    const viewport =
    page.getViewport({
        scale:currentScale
    });


    canvas.width =
    viewport.width;

    canvas.height =
    viewport.height;


    await page.render({

        canvasContext:ctx,

        viewport:viewport

    }).promise;


    document.getElementById("pageInfo")
        .textContent =
        "صفحة " +
        currentPage +
        " / " +
        pdfDocument.numPages;


    document.getElementById("zoomInfo")
        .textContent =
        Math.round(
            currentScale * 100
        ) + "%";


    /*
       استخراج النص بطريقة تحافظ
       على ترتيب الأسطر والفقرات
    */

    await extractText(page);


    sendState();

}


/* ==================================================
   استخراج النص بدون تقطيع عشوائي
================================================== */

async function extractText(page){

    const content =
    await page.getTextContent();


    const items =
    content.items || [];


    if(items.length === 0){

        sentences = [];

        currentSentence = -1;

        updateSentenceInfo();

        return;

    }


    /*
       PDF.js يعطينا مكان كل قطعة نص.
       نستخدم X و Y لإعادة بناء الأسطر.
    */

    const textItems =
    items
    .filter(item =>
        item.str &&
        item.str.trim()
    )
    .map(item => {

        const transform =
        item.transform || [];

        return {

            text:item.str.trim(),

            x:transform[4] || 0,

            y:transform[5] || 0,

            width:item.width || 0

        };

    });


    /*
       ترتيب من أعلى لأسفل.
       وبداخل السطر من اليمين لليسار
       لأن المستند عربي.
    */

    textItems.sort((a,b)=>{

        const yDifference =
        Math.abs(a.y - b.y);


        if(yDifference > 5){

            return b.y - a.y;

        }


        return b.x - a.x;

    });


    /*
       تجميع القطع الموجودة في نفس السطر
    */

    const lines = [];


    for(const item of textItems){

        let found = null;


        for(const line of lines){

            if(
                Math.abs(
                    line.y - item.y
                ) <= 5
            ){

                found = line;

                break;

            }

        }


        if(!found){

            found = {

                y:item.y,

                items:[]

            };

            lines.push(found);

        }


        found.items.push(item);

    }


    /*
       ترتيب كل سطر من اليمين لليسار
    */

    lines.forEach(line=>{

        line.items.sort(
            (a,b)=>b.x-a.x
        );

    });


    /*
       تحويل الأسطر إلى نص
    */

    const paragraphs = [];


    for(const line of lines){

        const lineText =
        line.items
        .map(item=>item.text)
        .join(" ")
        .replace(/\s+/g," ")
        .trim();


        if(lineText){

            paragraphs.push(lineText);

        }

    }


    /*
       هنا النقطة المهمة:

       لا نقسم الكلام كل 10 أو 12 كلمة.

       نحاول دمج الأسطر التي تكمل
       نفس الجملة.
    */

    sentences = [];


    let currentText = "";


    for(let i=0;i<paragraphs.length;i++){

        const text =
        paragraphs[i];


        if(!currentText){

            currentText = text;

        }else{

            currentText +=
            " " + text;

        }


        /*
           نهاية الجملة عند علامات الترقيم
        */

        const endsSentence =
        /[.!؟!?؛:]$/.test(text);


        /*
           إذا كان السطر يبدو عنوانًا
           أو فقرة منفصلة
        */

        const looksLikeHeading =
        text.length < 70 &&
        !/[،,؛;.!؟!?]$/.test(text);


        if(
            endsSentence ||
            looksLikeHeading
        ){

            sentences.push(
                currentText.trim()
            );

            currentText = "";

        }

    }


    if(currentText.trim()){

        sentences.push(
            currentText.trim()
        );

    }


    /*
       إذا خرجت جمل قليلة جدًا،
       نستخدم الفقرات كما هي بدل
       تقطيع النص.
    */

    if(sentences.length === 0){

        sentences =
        paragraphs;

    }


    currentSentence = -1;

    sentenceBox.style.display =
    "none";


    updateSentenceInfo();

}


/* ==================================================
   الجملة التالية
================================================== */

function showNextSentence(){

    if(!pdfDocument){

        return;

    }


    if(sentences.length === 0){

        sentenceBox.textContent =
        "لا يوجد نص قابل للاستخراج من هذه الصفحة.";

        sentenceBox.style.display =
        "block";

        return;

    }


    if(
        currentSentence <
        sentences.length - 1
    ){

        currentSentence++;


        sentenceBox.textContent =
        sentences[currentSentence];


        sentenceBox.style.display =
        "block";


        updateSentenceInfo();


        sendState();

    }

    else{

        /*
           انتهت جمل الصفحة.
           الانتقال تلقائيًا للصفحة التالية.
        */

        if(
            currentPage <
            pdfDocument.numPages
        ){

            currentPage++;

            displayPage();

        }

    }

}


/* ==================================================
   الجملة السابقة
================================================== */

function showPreviousSentence(){

    if(!pdfDocument){
        return;
    }


    if(currentSentence > 0){

        currentSentence--;


        sentenceBox.textContent =
        sentences[currentSentence];


        sentenceBox.style.display =
        "block";


        updateSentenceInfo();


        sendState();

    }

    else if(currentPage > 1){

        currentPage--;

        displayPage();

    }

}


/* ==================================================
   الصفحات
================================================== */

function nextPage(){

    if(
        pdfDocument &&
        currentPage <
        pdfDocument.numPages
    ){

        currentPage++;

        displayPage();

    }

}


function previousPage(){

    if(
        pdfDocument &&
        currentPage > 1
    ){

        currentPage--;

        displayPage();

    }

}


/* ==================================================
   إخفاء الجملة
================================================== */

function hideSentence(){

    sentenceBox.style.display =
    "none";

}


/* ==================================================
   التكبير
================================================== */

function zoomIn(){

    if(!pdfDocument){
        return;
    }


    currentScale += 0.15;


    if(currentScale > 3){
        currentScale = 3;
    }


    displayPage();

}


function zoomOut(){

    if(!pdfDocument){
        return;
    }


    currentScale -= 0.15;


    if(currentScale < 0.5){
        currentScale = 0.5;
    }


    displayPage();

}


function resetZoom(){

    if(!pdfDocument){
        return;
    }


    currentScale = 1;

    displayPage();

}


/* ==================================================
   معلومات الجملة
================================================== */

function updateSentenceInfo(){

    const number =
    currentSentence >= 0
    ? currentSentence + 1
    : 0;


    document.getElementById(
        "sentenceInfo"
    ).textContent =
    "جملة " +
    number +
    " / " +
    sentences.length;

}


/* ==================================================
   اتصال التلفزيون
================================================== */

if(!remoteModeEnabled){

    const code =
    String(
        Math.floor(
            100000 +
            Math.random() * 900000
        )
    );


    peer =
    new Peer(code,{
        debug:0
    });


    peer.on("open",function(id){

        document.getElementById(
            "connectionStatus"
        ).textContent =
        "كود التلفزيون: " + id;

    });


    peer.on("connection",function(conn){

        connection = conn;


        connection.on("open",function(){

            document.getElementById(
                "connectionStatus"
            ).textContent =
            "📱 الهاتف متصل ✓";

            document.getElementById(
                "connectionStatus"
            ).style.color =
            "#7ee8a0";


            sendState();

        });


        connection.on("data",function(data){

            handleCommand(data);

        });


        connection.on("close",function(){

            document.getElementById(
                "connectionStatus"
            ).textContent =
            "كود التلفزيون: " + code;

        });

    });


    peer.on("error",function(error){

        console.error(error);

        document.getElementById(
            "connectionStatus"
        ).textContent =
        "خطأ في الاتصال";

    });

}


/* ==================================================
   تنفيذ أوامر الهاتف
================================================== */

function handleCommand(data){

    if(!data){
        return;
    }


    switch(data.command){

        case "nextSentence":

            showNextSentence();

            break;


        case "previousSentence":

            showPreviousSentence();

            break;


        case "nextPage":

            nextPage();

            break;


        case "previousPage":

            previousPage();

            break;


        case "hideSentence":

            hideSentence();

            break;


        case "zoomIn":

            zoomIn();

            break;


        case "zoomOut":

            zoomOut();

            break;


        case "resetZoom":

            resetZoom();

            break;

    }

}


/* ==================================================
   إرسال حالة التلفزيون للهاتف
================================================== */

function sendState(){

    if(
        connection &&
        connection.open
    ){

        connection.send({

            type:"state",

            page:currentPage,

            sentence:
            currentSentence >= 0
            ? currentSentence + 1
            : 0,

            total:
            sentences.length

        });

    }

}


/* ==================================================
   وضع الريموت
================================================== */

if(remoteModeEnabled){

    let remotePeer = null;

    let remoteConnection = null;


    document.getElementById(
        "connectButton"
    ).onclick = function(){

        const code =
        document.getElementById(
            "tvCode"
        ).value.trim();


        if(!/^\d{6}$/.test(code)){

            document.getElementById(
                "remoteStatus"
            ).textContent =
            "اكتب كود التلفزيون المكون من 6 أرقام.";

            return;

        }


        document.getElementById(
            "remoteStatus"
        ).textContent =
        "جاري الاتصال...";


        remotePeer =
        new Peer();


        remotePeer.on("open",function(){

            remoteConnection =
            remotePeer.connect(
                code,
                {
                    reliable:true
                }
            );


            remoteConnection.on(
                "open",
                function(){

                    document.getElementById(
                        "remoteStatus"
                    ).textContent =
                    "🟢 متصل بالتلفزيون";


                    document.getElementById(
                        "remoteStatus"
                    ).style.color =
                    "#7ee8a0";


                    document.getElementById(
                        "controls"
                    ).style.display =
                    "block";

                }
            );


            remoteConnection.on(
                "data",
                function(data){

                    if(
                        data &&
                        data.type === "state"
                    ){

                        document.getElementById(
                            "remotePage"
                        ).textContent =
                        data.page;


                        document.getElementById(
                            "remoteSentence"
                        ).textContent =
                        data.sentence +
                        " / " +
                        data.total;

                    }

                }
            );


            remoteConnection.on(
                "close",
                function(){

                    document.getElementById(
                        "remoteStatus"
                    ).textContent =
                    "انقطع الاتصال.";

                    document.getElementById(
                        "remoteStatus"
                    ).style.color =
                    "#ffd166";

                }
            );

        });


        remotePeer.on(
            "error",
            function(){

                document.getElementById(
                    "remoteStatus"
                ).textContent =
                "❌ فشل الاتصال. تأكد من الكود.";

                document.getElementById(
                    "remoteStatus"
                ).style.color =
                "#ff6675";

            }
        );

    };


    /* إرسال أمر للتلفزيون */

    function sendCommand(command){

        if(
            remoteConnection &&
            remoteConnection.open
        ){

            remoteConnection.send({

                command:command

            });

        }

    }


    document.getElementById(
        "nextSentence"
    ).onclick =
    function(){

        sendCommand(
            "nextSentence"
        );

    };


    document.getElementById(
        "previousSentence"
    ).onclick =
    function(){

        sendCommand(
            "previousSentence"
        );

    };


    document.getElementById(
        "nextPage"
    ).onclick =
    function(){

        sendCommand(
            "nextPage"
        );

    };


    document.getElementById(
        "previousPage"
    ).onclick =
    function(){

        sendCommand(
            "previousPage"
        );

    };


    document.getElementById(
        "hideSentence"
    ).onclick =
    function(){

        sendCommand(
            "hideSentence"
        );

    };


    document.getElementById(
        "zoomIn"
    ).onclick =
    function(){

        sendCommand(
            "zoomIn"
        );

    };


    document.getElementById(
        "zoomOut"
    ).onclick =
    function(){

        sendCommand(
            "zoomOut"
        );

    };


    document.getElementById(
        "resetZoom"
    ).onclick =
    function(){

        sendCommand(
            "resetZoom"
        );

    };

}

</script>
