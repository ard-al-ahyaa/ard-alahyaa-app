<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عارض المحاضرات الاحترافي PDF</title>
    
    <!-- 📚 المكتبات الخارجية المستدعاة للتشغيل -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        :root {
            --bg-main: #0B0F19; /* خلفية داكنة فخمة وعميقة */
            --bg-card: #151D30; /* خلفية الكروت اللامعة */
            --bg-card-hover: #1E2942;
            --accent-glow: #00D2FC; /* أزرق سيبراني نيون مضيء */
            --accent-solid: #00A8CC;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --danger: #FF4B72;
            --success: #10B981;
            --shadow-glow: 0px 0px 20px rgba(0, 210, 252, 0.25);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ==========================================
           🎨 تنسيقات شاشة العرض (Tv Style)
        ========================================== */
        #Tv {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #tv-setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 25px;
            padding: 40px;
            text-align: center;
            background: radial-gradient(circle at center, #1E2942 0%, #0B0F19 100%);
        }

        #tv-setup h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .peer-code-box {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: var(--accent-glow);
            background: var(--bg-card);
            padding: 20px 50px;
            border-radius: 20px;
            border: 2px solid rgba(0, 210, 252, 0.4);
            box-shadow: var(--shadow-glow);
            text-shadow: 0 0 10px rgba(0, 210, 252, 0.5);
        }

        .file-upload-btn {
            background: linear-gradient(135deg, var(--accent-solid) 0%, #007EA7 100%);
            color: #fff;
            padding: 16px 40px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 168, 204, 0.4);
        }
        
        .file-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 252, 0.6);
        }
        
        #file-input { display: none; }
        
        #viewer-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080B11;
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #pdf-canvas {
            max-width: 98%;
            max-height: 98%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 8px;
            display: block;
        }
        
        #caption-overlay {
            position: absolute;
            bottom: 4%;
            left: 6%;
            right: 6%;
            background: rgba(11, 15, 25, 0.95);
            color: #fff;
            padding: 30px 50px;
            border-radius: 24px;
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
            border: 2px solid rgba(0, 210, 252, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), var(--shadow-glow);
            backdrop-filter: blur(10px);
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #caption-overlay.hidden {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
        }

        /* ==========================================
           🎨 تنسيقات شاشة التحكم (Control Style)
        ========================================== */
        #Control {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 20px;
            background: #0B0F19;
        }
        
        #mobile-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 25px;
        }
        
        .code-input {
            width: 90%;
            max-width: 320px;
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            padding: 15px;
            letter-spacing: 8px;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            background: var(--bg-card);
            color: #fff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        
        .code-input:focus {
            border-color: var(--accent-glow);
            outline: none;
            box-shadow: var(--shadow-glow);
        }
        
        .btn {
            background: linear-gradient(135deg, var(--accent-solid) 0%, #007EA7 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0, 168, 204, 0.3);
        }
        
        #mobile-dashboard {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 15px;
        }
        
        .status-bar {
            background: rgba(21, 29, 48, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
        
        .info-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, #0F1626 100%);
            border: 1px solid rgba(0, 210, 252, 0.15);
            padding: 20px;
            border-radius: 20px;
            flex: 1;
            min-height: 130px;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .info-label { 
            font-size: 0.85rem; 
            font-weight: 600;
            color: var(--accent-glow); 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .info-value { 
            font-size: 1.3rem; 
            font-weight: 700; 
            line-height: 1.6;
            color: #fff;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }
        
        .ctrl-btn {
            background: var(--bg-card);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 22px 10px; /* أزرار عملاقة وسهلة اللمس */
            font-size: 1.15rem;
            font-weight: 600;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .ctrl-btn:active { 
            transform: scale(0.96);
            background: var(--bg-card-hover);
        }
        
        .ctrl-btn.primary { 
            background: linear-gradient(135deg, #00B4DB 0%, #0083B0 100%); 
            border: none; 
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0, 180, 219, 0.3);
        }
        
        .ctrl-btn.primary:active { background: #007399; }
        
        .ctrl-btn.danger { 
            background: linear-gradient(135deg, #FF4B72 0%, #DC2626 100%); 
            border: none; 
            box-shadow: 0 4px 12px rgba(255, 75, 114, 0.3);
        }
        
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

    <!-- ========================================================
         📺 SECTION 1: Tv (شاشة العرض الكبيرة للتلفزيون)
         ======================================================== -->
    <div id="Tv">
        <div id="tv-setup">
            <h2>شاشة العرض الرئيسية (التلفزيون)</h2>
            <p style="color: var(--text-secondary);">أدخل هذا الرمز في شاشة التحكم بالهاتف للربط اللاسلكي:</p>
            <div class="peer-code-box" id="tv-code-display">------</div>
            <p style="color: var(--text-secondary);">ثم قم باختيار ملف الـ PDF لبدء المحاضرة:</p>
            <label class="file-upload-btn" for="file-input">📂 اضغط لاختيار ملف PDF</label>
            <input type="file" id="file-input" accept="application/pdf">
            <div id="tv-status" style="color: var(--accent-glow); margin-top: 10px; font-weight: 600;">جاري تشغيل خادم الاتصال الذكي...</div>
        </div>
