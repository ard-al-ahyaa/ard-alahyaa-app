<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>عارض المحاضرات</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

/* ==================================================
   أساس الصفحة
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

button,
input{
    font-family:inherit;
}

.hidden{
    display:none !important;
}


/* ==================================================
   شاشة البداية
================================================== */

#startScreen{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #18202b,
            #050608 70%
        );

    color:white;

    padding:20px;

    overflow:auto;
}


.startBox{

    width:min(
        650px,
        100%
    );

    background:#11151b;

    border:1px solid #29313c;

    border-radius:24px;

    padding:35px 25px;

    text-align:center;

    box-shadow:
        0 20px 60px #000b;
}


.startBox h1{

    font-size:
        clamp(
            24px,
            4vw,
            36px
        );

    margin-bottom:12px;

}


.startBox p{

    color:#9da7b5;

    font-size:
        clamp(
            14px,
            2vw,
            18px
        );

    margin-bottom:30px;

}


.modeButtons{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:15px;

}


.modeButton{

    min-height:150px;

    border:0;

    border-radius:20px;

    color:white;

    background:#1268e8;

    font-size:
        clamp(
            17px,
            3vw,
            23px
        );

    cursor:pointer;

    transition:.2s;

}


.modeButton:hover{

    transform:
        translateY(-3px);

}


.modeButton.tv{

    background:#16864d;

}


.modeIcon{

    display:block;

    font-size:
        clamp(
            42px,
            7vw,
            65px
        );

    margin-bottom:12px;

}


/* ==================================================
   التلفزيون
================================================== */

#tvScreen{

    position:fixed;

    inset:0;

    background:#000;

    overflow:hidden;

}


/*
   مساحة عرض PDF
*/

#tvStage{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#000;

}


/*
   Canvas
*/

#pdfCanvas{

    display:block;

    max-width:100vw;

    max-height:100vh;

    width:auto;

    height:auto;

    object-fit:contain;

}


/*
   شاشة الانتظار
*/

#tvWaiting{

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:90%;

    text-align:center;

    color:#737d89;

}


#tvWaiting .icon{

    font-size:
        clamp(
            60px,
            10vw,
            120px
        );

    margin-bottom:15px;

}


#tvWaiting h2{

    font-size:
        clamp(
            22px,
            4vw,
            48px
        );

    margin-bottom:12px;

}


#tvWaiting p{

    font-size:
        clamp(
            14px,
            2.5vw,
            27px
        );

    color:#555e69;

}


/*
   حالة إخفاء الصفحة
*/

#hiddenScreen{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:#000;

    color:#555;

    font-size:
        clamp(
            20px,
            4vw,
            40px
        );

}


#hiddenScreen.active{

    display:flex;

}


/*
   رقم الصفحة
*/

#pageIndicator{

    position:absolute;

    left:50%;

    bottom:25px;

    transform:
        translateX(-50%);

    padding:
        9px 22px;

    background:
        rgba(
            0,
            0,
            0,
            .75
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .15
        );

    border-radius:30px;

    color:white;

    font-size:
        clamp(
            15px,
            2vw,
            25px
        );

    opacity:0;

    transition:.25s;

    pointer-events:none;

}


#pageIndicator.show{

    opacity:1;

}


/*
   زر ملء الشاشة
*/

#fullscreenButton{

    position:absolute;

    left:20px;

    bottom:20px;

    padding:
        10px 16px;

    border:
        1px solid #333;

    border-radius:10px;

    background:
        rgba(
            20,
            20,
            20,
            .8
        );

    color:white;

    cursor:pointer;

    opacity:.15;

    transition:.2s;

}


#fullscreenButton:hover{

    opacity:1;

}


/* ==================================================
   الهاتف / الريموت
================================================== */

#remoteScreen{

    position:fixed;

    inset:0;

    background:#080a0d;

    color:white;

    overflow:auto;

    padding:
        clamp(
            10px,
            3vw,
            25px
        );

}


.remoteContainer{

    width:100%;

    max-width:650px;

    margin:auto;

}


.remoteHeader{

    text-align:center;

    padding:
        8px 0 18px;

}


.remoteHeader h1{

    font-size:
        clamp(
            22px,
            5vw,
            30px
        );

}


.remoteHeader p{

    margin-top:7px;

    color:#87909c;

}


.card{

    background:#12161c;

    border:
        1px solid #242c36;

    border-radius:18px;

    padding:
        clamp(
            14px,
            3vw,
            20px
        );

    margin-bottom:14px;

}


.cardTitle{

    font-size:
        clamp(
            17px,
            4vw,
            21px
        );

    margin-bottom:15px;

}


/*
   اختيار PDF
*/

#pdfFile{

    width:100%;

    padding:12px;

    border-radius:10px;

    border:1px solid #333;

    background:#080a0d;

    color:white;

}


.status{

    margin-top:10px;

    text-align:center;

    color:#929ba6;

    font-size:14px;

}


/*
   رقم الصفحة
*/

.pageInfo{

    text-align:center;

    font-size:
        clamp(
            16px,
            4vw,
            20px
        );

    color:#c7ced7;

    margin-bottom:15px;

}


/*
   أزرار التحكم
*/

.controls{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:12px;

}


.control{

    min-height:
        clamp(
            70px,
            18vw,
            100px
        );

    border:0;

    border-radius:17px;

    color:white;

    font-size:
        clamp(
            17px,
            4vw,
            22px
        );

    cursor:pointer;

    transition:.12s;

}


.control:active{

    transform:scale(.96);

}


.previous{

    background:#30353d;

}


.next{

    background:#1268e8;

}


.show{

    background:#16864d;

}


.hide{

    background:#a33030;

}


/*
   زر عام
*/

.fullButton{

    width:100%;

    border:0;

    border-radius:13px;

    background:#252b34;

    color:white;

    padding:14px;

    margin-top:12px;

    font-size:16px;

    cursor:pointer;

}


/* ==================================================
   التابلت
================================================== */

@media
(min-width:600px)
and
(max-width:1100px){

    .controls{

        grid-template-columns:
            repeat(
                4,
                minmax(0,1fr)
            );

    }

}


/* ==================================================
   التلفزيون العريض
================================================== */

@media
(min-width:1200px){

    #pageIndicator{

        bottom:35px;

    }

}


/* ==================================================
   الهاتف العمودي
================================================== */

@media
(max-width:599px){

    .modeButtons{

        grid-template-columns:1fr;

    }


    .modeButton{

        min-height:120px;

    }

}


/* ==================================================
   الهاتف الأفقي
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    #remoteScreen{

        padding:8px;

    }


    .remoteHeader{

        padding:3px;

    }


    .remoteHeader h1{

        font-size:20px;

    }


    .card{

        padding:10px;

        margin-bottom:8px;

    }


    .control{

        min-height:55px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     شاشة البداية
================================================== -->

<section id="startScreen">

    <div class="startBox">

        <h1>
            📺 عارض المحاضرات
        </h1>

        <p>
            اختر وضع الجهاز
        </p>


        <div class="modeButtons">

            <button
                class="modeButton tv"
                onclick="openTV()">

                <span class="modeIcon">
                    📺
                </span>

                شاشة التلفزيون

            </button>


            <button
                class="modeButton"
                onclick="openRemote()">

                <span class="modeIcon">
                    📱
                </span>

                ريموت الهاتف

            </button>

        </div>

    </div>

</section>


<!-- ==================================================
     شاشة التلفزيون
================================================== -->

<section
    id="tvScreen"
    style="display:none">


    <div id="tvStage">


        <div id="tvWaiting">

            <div class="icon">
                📺
            </div>

            <h2>
                عارض المحاضرات
            </h2>

            <p>
                جاهز لعرض ملف PDF
            </p>

        </div>


        <canvas
            id="pdfCanvas">
        </canvas>


    </div>


    <div id="hiddenScreen">

        العرض مخفي

    </div>


    <div id="pageIndicator">

        الصفحة

        <span id="tvPage">
            1
        </span>

    </div>


    <button
        id="fullscreenButton"
        onclick="fullscreenTV()">

        ⛶ ملء الشاشة

    </button>

</section>


<!-- ==================================================
     شاشة الهاتف
================================================== -->

<section
    id="remoteScreen"
    style="display:none">


    <div class="remoteContainer">


        <header class="remoteHeader">

            <h1>
                📱 ريموت المحاضرات
            </h1>

            <p>
                تحكم في صفحات العرض
            </p>

        </header>


        <!-- ملف PDF -->

        <div class="card">

            <div class="cardTitle">
                📄 ملف PDF
            </div>


            <input
                id="pdfFile"
                type="file"
                accept="application/pdf"
                onchange="loadPDF(event)">


            <div
                id="pdfStatus"
                class="status">

                لم يتم اختيار ملف

            </div>

        </div>


        <!-- التحكم -->

        <div class="card">

            <div class="cardTitle">
                🎮 التحكم
            </div>


            <div class="pageInfo">

                الصفحة

                <b id="currentPage">
                    1
                </b>

                من

                <b id="totalPages">
                    0
                </b>

            </div>


            <div class="controls">


                <button
                    class="control previous"
                    onclick="previousPage()">

                    ◀
                    <br>
                    السابق

                </button>


                <button
                    class="control next"
                    onclick="nextPage()">

                    التالي
                    <br>
                    ▶

                </button>


                <button
                    class="control show"
                    onclick="showPage()">

                    👁️
                    <br>
                    إظهار

                </button>


                <button
                    class="control hide"
                    onclick="hidePage()">

                    🙈
                    <br>
                    إخفاء

                </button>


            </div>


            <button
                class="fullButton"
                onclick="fullscreenTV()">

                ⛶ ملء الشاشة

            </button>

        </div>


    </div>

</section>


<script>

/* ==================================================
   PDF.js
================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* ==================================================
   المتغيرات
================================================== */

let pdfDocument = null;

let currentPage = 1;

let totalPages = 0;

let pageVisible = true;

let indicatorTimer;


/* ==================================================
   فتح التلفزيون
================================================== */

function openTV(){

    document
        .getElementById("startScreen")
        .style.display = "none";


    document
        .getElementById("tvScreen")
        .style.display = "block";

}


/* ==================================================
   فتح الهاتف
================================================== */

function openRemote(){

    document
        .getElementById("startScreen")
        .style.display = "none";


    document
        .getElementById("remoteScreen")
        .style.display = "block";

}


/* ==================================================
   تحميل PDF
================================================== */

async function loadPDF(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    if(file.type !== "application/pdf"){

        alert(
            "اختر ملف PDF فقط"
        );

        return;

    }


    try{

        const buffer =
            await file.arrayBuffer();


        pdfDocument =
            await pdfjsLib
            .getDocument({
                data:buffer
            })
            .promise;


        totalPages =
            pdfDocument.numPages;


        currentPage = 1;


        document
            .getElementById(
                "totalPages"
            )
            .textContent =
            totalPages;


        document
            .getElementById(
                "currentPage"
            )
            .textContent =
            currentPage;


        document
            .getElementById(
                "pdfStatus"
            )
            .textContent =
            "تم فتح: " +
            file.name;


        /*
           إذا كان الجهاز في وضع التلفزيون
        */

        if(
            document
            .getElementById(
                "tvScreen"
            )
            .style.display !== "none"
        ){

            await renderPage(
                currentPage
            );

        }


    }catch(error){

        console.error(error);

        alert(
            "تعذر فتح ملف PDF"
        );

    }

}


/* ==================================================
   رسم صفحة PDF
================================================== */

async function renderPage(number){

    if(!pdfDocument){

        return;

    }


    const page =
        await pdfDocument
        .getPage(number);


    const canvas =
        document
        .getElementById(
            "pdfCanvas"
        );


    const context =
        canvas.getContext(
            "2d"
        );


    const width =
        window.innerWidth;


    const height =
        window.innerHeight;


    const original =
        page.getViewport({
            scale:1
        });


    /*
       نستخدم أكبر حجم ممكن
       بدون قص الصفحة
    */

    const scale =
        Math.min(

            width /
            original.width,

            height /
            original.height

        );


    const viewport =
        page.getViewport({
            scale:scale
        });


    canvas.width =
        Math.round(
            viewport.width
        );


    canvas.height =
        Math.round(
            viewport.height
        );


    await page.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    document
        .getElementById(
            "tvWaiting"
        )
        .style.display =
        "none";


    canvas.style.display =
        "block";


    updateTVPage();


    showIndicator();

}


/* ==================================================
   التالي
================================================== */

function nextPage(){

    if(!pdfDocument){

        return;

    }


    if(
        currentPage <
        totalPages
    ){

        currentPage++;

        updateRemotePage();

        renderPage(
            currentPage
        );

    }

}


/* ==================================================
   السابق
================================================== */

function previousPage(){

    if(!pdfDocument){

        return;

    }


    if(currentPage > 1){

        currentPage--;

        updateRemotePage();

        renderPage(
            currentPage
        );

    }

}


/* ==================================================
   تحديث رقم الهاتف
================================================== */

function updateRemotePage(){

    document
        .getElementById(
            "currentPage"
        )
        .textContent =
        currentPage;

}


/* ==================================================
   تحديث رقم التلفزيون
================================================== */

function updateTVPage(){

    document
        .getElementById(
            "tvPage"
        )
        .textContent =
        currentPage;

}


/* ==================================================
   إظهار الصفحة
================================================== */

function showPage(){

    pageVisible = true;


    document
        .getElementById(
            "pdfCanvas"
        )
        .style.visibility =
        "visible";


    document
        .getElementById(
            "hiddenScreen"
        )
        .classList.remove(
            "active"
        );

}


/* ==================================================
   إخفاء الصفحة
================================================== */

function hidePage(){

    pageVisible = false;


    document
        .getElementById(
            "pdfCanvas"
        )
        .style.visibility =
        "hidden";


    document
        .getElementById(
            "hiddenScreen"
        )
        .classList.add(
            "active"
        );

}


/* ==================================================
   رقم الصفحة مؤقتًا
================================================== */

function showIndicator(){

    const indicator =
        document
        .getElementById(
            "pageIndicator"
        );


    indicator.classList.add(
        "show"
    );


    clearTimeout(
        indicatorTimer
    );


    indicatorTimer =
        setTimeout(
            function(){

                indicator.classList.remove(
                    "show"
                );

            },
            1200
        );

}


/* ==================================================
   ملء الشاشة
================================================== */

async function fullscreenTV(){

    try{

        if(
            !document.fullscreenElement
        ){

            await document
                .documentElement
                .requestFullscreen();

        }

    }catch(error){

        console.log(error);

    }

}


/* ==================================================
   الأسهم من لوحة المفاتيح
================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "ArrowRight"
        ){

            nextPage();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousPage();

        }


        if(
            event.key ===
            "Escape"
        ){

            showPage();

        }

    }
);


/* ==================================================
   إعادة ضبط حجم PDF
================================================== */

let resizeTimer;

window.addEventListener(
    "resize",
    function(){

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                function(){

                    if(
                        pdfDocument &&
                        document
                        .getElementById(
                            "tvScreen"
                        )
                        .style.display !==
                        "none"
                    ){

                        renderPage(
                            currentPage
                        );

                    }

                },
                200
            );

    }
);

</script>

</body>
</html>
