<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عارض المحاضرات الاحترافي</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- PeerJS للتحكم من الهاتف -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Tahoma,Arial,sans-serif;
    background:#05080d;
    color:white;
}

body{
    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

/* =====================================================
   الشاشة الرئيسية
===================================================== */

#app{
    width:100%;
    height:100vh;
    position:relative;
}

/* =====================================================
   قسم العرض
===================================================== */

#displaySection{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    background:#070a0f;
}

/* الشريط العلوي */

.displayHeader{

    height:65px;
    min-height:65px;

    background:#101722;

    border-bottom:1px solid #293748;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

}

.displayTitle{

    font-size:23px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.connection{

    color:#7ee8a0;

    font-size:15px;

}

/* منطقة PDF */

.pdfArea{

    flex:1;

    position:relative;

    overflow:auto;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:15px;

}

#pdfCanvas{

    background:white;

    display:block;

    box-shadow:
        0 10px 50px rgba(0,0,0,.7);

}

/* رسالة البداية */

.startScreen{

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    color:#aeb9c8;

    font-size:25px;

    line-height:2;

}

/* =====================================================
   صندوق الجملة
===================================================== */

#sentenceOverlay{

    position:fixed;

    left:50%;

    bottom:100px;

    transform:translateX(-50%);

    width:min(92vw,1250px);

    min-height:80px;

    padding:18px 30px;

    background:rgba(0,0,0,.84);

    border:2px solid rgba(255,255,255,.2);

    border-radius:18px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.7);

    text-align:center;

    font-size:clamp(25px,3vw,48px);

    line-height:1.8;

    color:white;

    z-index:100;

    display:none;

}

/* =====================================================
   الشريط السفلي
===================================================== */

.displayFooter{

    height:65px;

    min-height:65px;

    background:#101722;

    border-top:1px solid #293748;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:30px;

    font-size:16px;

}

.fileButton{

    background:#1687ff;

    color:white;

    border:0;

    padding:11px 20px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

}

.fileButton:hover{

    background:#0d75df;

}

/* =====================================================
   قسم التحكم
===================================================== */

#controlSection{

    display:none;

    width:100%;

    min-height:100vh;

    overflow:auto;

    background:
        linear-gradient(
            145deg,
            #07111d,
            #0d1929
        );

    padding:20px;

}

.controlCard{

    width:min(100%,550px);

    margin:auto;

    background:#111c2a;

    border:1px solid #2c4057;

    border-radius:25px;

    padding:25px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);

}

.controlHeader{

    text-align:center;

    margin-bottom:20px;

}

.controlHeader h1{

    margin:0 0 8px;

    font-size:28px;

}

.controlHeader p{

    margin:0;

    color:#aebaca;

    line-height:1.7;

}

/* الاتصال */

label{

    display:block;

    margin:10px 0;

    color:#dce5ef;

}

#tvCode{

    width:100%;

    padding:16px;

    background:#09111b;

    border:1px solid #35495f;

    border-radius:13px;

    color:white;

    outline:none;

    font-size:21px;

    text-align:center;

    letter-spacing:5px;

}

.connectButton{

    width:100%;

    margin-top:12px;

    padding:16px;

    border:0;

    border-radius:13px;

    background:#1687ff;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

#controlStatus{

    text-align:center;

    margin:15px 0;

    color:#ffd166;

}

/* معلومات العرض */

.controlInfo{

    background:#09111b;

    border:1px solid #293b50;

    border-radius:13px;

    padding:15px;

    text-align:center;

    line-height:2;

    color:#d6e0eb;

    margin-bottom:12px;

}

.controlInfo b{

    color:#72bfff;

}

/* زر الجملة */

.nextSentenceButton{

    width:100%;

    padding:22px;

    border:0;

    border-radius:17px;

    background:#19a957;

    color:white;

    font-size:27px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:12px;

}

.nextSentenceButton:active,
.controlButton:active,
.connectButton:active{

    transform:scale(.97);

}

/* شبكة التحكم */

.controlGrid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.controlButton{

    border:0;

    border-radius:13px;

    padding:16px;

    background:#27384c;

    color:white;

    font-size:16px;

    cursor:pointer;

}

.hideButton{

    background:#d94352;

}

/* التكبير */

.zoomGrid{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:10px;

    margin-top:10px;

}

/* =====================================================
   إخفاء
===================================================== */

.hidden{

    display:none !important;

}

/* =====================================================
   الهاتف
===================================================== */

@media(max-width:500px){

    .controlCard{

        padding:18px;

    }

    .controlHeader h1{

        font-size:23px;

    }

    .nextSentenceButton{

        font-size:22px;

        padding:20px;

    }

}

</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     📺 قسم العرض
===================================================== -->

<section id="displaySection">

    <header class="displayHeader">

        <div
            id="displayTitle"
            class="displayTitle"
        >
            📺 عارض المحاضرات
        </div>

        <div
            id="connectionStatus"
            class="connection"
        >
            جاري تشغيل الريموت...
        </div>

    </header>


    <main class="pdfArea">

        <canvas id="pdfCanvas"></canvas>

        <div
            id="startScreen"
            class="startScreen"
        >

            📄 اختر ملف PDF للبدء

            <br>

            ثم استخدم الهاتف كجهاز تحكم

        </div>

    </main>


    <!-- الجملة تظهر هنا -->

    <div id="sentenceOverlay"></div>


    <footer class="displayFooter">

        <button
            id="choosePdf"
            class="fileButton"
        >
            📄 اختيار ملف PDF
        </button>

        <input
            id="pdfInput"
            type="file"
            accept="application/pdf"
            hidden
        >

        <span id="pageInfo">
            صفحة 0 / 0
        </span>

        <span id="sentenceInfo">
            جملة 0 / 0
        </span>

        <span id="zoomInfo">
            100%
        </span>

    </footer>

</section>


<!-- =====================================================
     📱 قسم التحكم
===================================================== -->

<section id="controlSection">

    <div class="controlCard">

        <div class="controlHeader">

            <h1>
                📱 ريموت المحاضرات
            </h1>

            <p>
                تحكم في ملف الـPDF الموجود على شاشة التلفزيون.
            </p>

        </div>


        <label>
            اكتب كود التلفزيون
        </label>


        <input
            id="tvCode"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="123456"
        >


        <button
            id="connectButton"
            class="connectButton"
        >
            🔗 اتصال بالتلفزيون
        </button>


        <div id="controlStatus">
            غير متصل
        </div>


        <div
            id="controls"
            class="hidden"
        >

            <div class="controlInfo">

                الصفحة:

                <b id="remotePage">
                    0
                </b>

                <br>

                الجملة:

                <b id="remoteSentence">
                    0 / 0
                </b>

            </div>


            <!-- =================================================
                 زر الجملة التالية
            ================================================== -->

            <button
                id="nextSentence"
                class="nextSentenceButton"
            >
                ▶ الجملة التالية
            </button>


            <!-- =================================================
                 أزرار الصفحات والجمل
            ================================================== -->

            <div class="controlGrid">

                <button
                    id="previousSentence"
                    class="controlButton"
                >
                    ◀ الجملة السابقة
                </button>


                <button
                    id="nextPage"
                    class="controlButton"
                >
                    الصفحة التالية ▶
                </button>


                <button
                    id="previousPage"
                    class="controlButton"
                >
                    ◀ الصفحة السابقة
                </button>


                <button
                    id="hideSentence"
                    class="controlButton hideButton"
                >
                    👁 إخفاء الجملة
                </button>

            </div>


            <!-- =================================================
                 التكبير
            ================================================== -->

            <div class="zoomGrid">

                <button
                    id="zoomOut"
                    class="controlButton"
                >
                    − تصغير
                </button>


                <button
                    id="resetZoom"
                    class="controlButton"
                >
                    100%
                </button>


                <button
                    id="zoomIn"
                    class="controlButton"
                >
                    + تكبير
                </button>

            </div>

        </div>

    </div>

</section>

</div>


<script>

/* =====================================================
   إعداد PDF.js
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================================
   تحديد الوضع
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);

const isControlMode =
params.get("control") === "1";


const displaySection =
document.getElementById(
    "displaySection"
);

const controlSection =
document.getElementById(
    "controlSection"
);


/* =====================================================
   إذا كان الرابط ?control=1
   يظهر قسم التحكم فقط
===================================================== */

if(isControlMode){

    displaySection.style.display =
    "none";

    controlSection.style.display =
    "block";

}


/* =====================================================
   المتغيرات
===================================================== */

let pdfDocument = null;

let currentPage = 1;

let currentScale = 1;

let sentences = [];

let currentSentence = -1;


/* =====================================================
   عناصر العرض
===================================================== */

const canvas =
document.getElementById(
    "pdfCanvas"
);

const ctx =
canvas.getContext("2d");

const sentenceOverlay =
document.getElementById(
    "sentenceOverlay"
);


/* =====================================================
   اختيار PDF
===================================================== */

if(!isControlMode){

    document.getElementById(
        "choosePdf"
    ).onclick = function(){

        document.getElementById(
            "pdfInput"
        ).click();

    };


    document.getElementById(
        "pdfInput"
    ).onchange = async function(){

        const file =
        this.files[0];


        if(!file){

            return;

        }


        try{

            const buffer =
            await file.arrayBuffer();


            pdfDocument =
            await pdfjsLib.getDocument({
                data:buffer
            }).promise;


            currentPage = 1;

            currentScale = 1;


            document.getElementById(
                "displayTitle"
            ).textContent =
            "📺 " + file.name;


            document.getElementById(
                "startScreen"
            ).style.display =
            "none";


            await renderPage();


        }catch(error){

            console.error(error);

            alert(
                "حدث خطأ أثناء فتح ملف PDF."
            );

        }

    };

}


/* =====================================================
   عرض الصفحة
===================================================== */

async function renderPage(){

    if(!pdfDocument){

        return;

    }


    const page =
    await pdfDocument.getPage(
        currentPage
    );


    const viewport =
    page.getViewport({
        scale:currentScale
    });


    canvas.width =
    viewport.width;

    canvas.height =
    viewport.height;


    await page.render({

        canvasContext:ctx,

        viewport:viewport

    }).promise;


    document.getElementById(
        "pageInfo"
    ).textContent =
    "صفحة " +
    currentPage +
    " / " +
    pdfDocument.numPages;


    document.getElementById(
        "zoomInfo"
    ).textContent =
    Math.round(
        currentScale * 100
    ) + "%";


    await extractSentences(page);


    sendState();

}


/* =====================================================
   استخراج الجمل
===================================================== */

async function extractSentences(page){

    const content =
    await page.getTextContent();


    const items =
    content.items || [];


    if(!items.length){

        sentences = [];

        currentSentence = -1;

        updateSentenceInfo();

        return;

    }


    /*
       نأخذ موقع كل قطعة نص.
    */

    let textItems =
    items
    .filter(item =>
        item.str &&
        item.str.trim()
    )
    .map(item => {

        const t =
        item.transform || [];


        return {

            text:item.str.trim(),

            x:t[4] || 0,

            y:t[5] || 0,

            width:item.width || 0

        };

    });


    /*
       ترتيب الأسطر من أعلى لأسفل.
    */

    textItems.sort(
        (a,b)=>{

            const yDiff =
            Math.abs(a.y-b.y);


            if(yDiff > 5){

                return b.y-a.y;

            }


            /*
               العربية من اليمين لليسار.
            */

            return b.x-a.x;

        }
    );


    /*
       تجميع النص الموجود في نفس السطر.
    */

    const lines = [];


    textItems.forEach(item => {

        let line = null;


        for(const existing of lines){

            if(
                Math.abs(
                    existing.y-item.y
                ) <= 5
            ){

                line = existing;

                break;

            }

        }


        if(!line){

            line = {

                y:item.y,

                items:[]

            };


            lines.push(line);

        }


        line.items.push(item);

    });


    /*
       ترتيب النص داخل السطر.
    */

    lines.forEach(line => {

        line.items.sort(
            (a,b)=>b.x-a.x
        );

    });


    /*
       تحويل السطور إلى نص.
    */

    const linesText =
    lines
    .map(line =>

        line.items
        .map(item=>item.text)
        .join(" ")
        .replace(/\s+/g," ")
        .trim()

    )
    .filter(Boolean);


    /*
       الآن نجمع الأسطر في جمل كاملة.

       لا يوجد تقسيم كل 10 أو 12 كلمة.

       الجملة تستمر حتى تصل إلى
       علامة نهاية حقيقية.
    */

    sentences = [];


    let currentText = "";


    for(let i=0;i<linesText.length;i++){

        const line =
        linesText[i];


        if(!currentText){

            currentText = line;

        }else{

            currentText +=
            " " + line;

        }


        /*
           نهاية الجملة.
        */

        const sentenceEnd =
        /[.!؟!?؛]$/.test(line);


        /*
           بعض ملفات PDF تحتوي على
           عناوين قصيرة.
        */

        const nextLine =
        linesText[i+1] || "";


        const shortHeading =
        currentText.length < 100 &&
        nextLine.length > 0 &&
        !/[،,؛:：]$/.test(line) &&
        !/[.!؟!?؛]$/.test(line);


        if(sentenceEnd){

            sentences.push(
                currentText.trim()
            );

            currentText = "";

        }

        else if(
            shortHeading &&
            currentText.length < 60
        ){

            /*
               العنوان يعامل كوحدة واحدة.
            */

            sentences.push(
                currentText.trim()
            );

            currentText = "";

        }

    }


    /*
       أي نص متبقٍ.
    */

    if(currentText.trim()){

        sentences.push(
            currentText.trim()
        );

    }


    /*
       منع العناصر الفارغة.
    */

    sentences =
    sentences
    .map(x=>x.trim())
    .filter(x=>x.length>0);


    currentSentence = -1;


    sentenceOverlay.style.display =
    "none";


    updateSentenceInfo();

}


/* =====================================================
   الجملة التالية
===================================================== */

function nextSentence(){

    if(!pdfDocument){

        return;

    }


    if(sentences.length === 0){

        sentenceOverlay.textContent =
        "هذه الصفحة لا تحتوي على نص قابل للاستخراج.";

        sentenceOverlay.style.display =
        "block";

        return;

    }


    /*
       إظهار الجملة التالية.
    */

    if(
        currentSentence <
        sentences.length-1
    ){

        currentSentence++;


        sentenceOverlay.textContent =
        sentences[currentSentence];


        sentenceOverlay.style.display =
        "block";


        updateSentenceInfo();


        sendState();

    }

    else{

        /*
           انتهت جمل الصفحة.
           ننتقل للصفحة التالية.
        */

        if(
            currentPage <
            pdfDocument.numPages
        ){

            currentPage++;

            renderPage();

        }

    }

}


/* =====================================================
   الجملة السابقة
===================================================== */

function previousSentence(){

    if(!pdfDocument){

        return;

    }


    if(currentSentence > 0){

        currentSentence--;


        sentenceOverlay.textContent =
        sentences[currentSentence];


        sentenceOverlay.style.display =
        "block";


        updateSentenceInfo();


        sendState();

    }

    else if(currentPage > 1){

        currentPage--;

        renderPage();

    }

}


/* =====================================================
   الصفحات
===================================================== */

function nextPage(){

    if(
        pdfDocument &&
        currentPage <
        pdfDocument.numPages
    ){

        currentPage++;

        renderPage();

    }

}


function previousPage(){

    if(
        pdfDocument &&
        currentPage > 1
    ){

        currentPage--;

        renderPage();

    }

}


/* =====================================================
   إخفاء الجملة
===================================================== */

function hideSentence(){

    sentenceOverlay.style.display =
    "none";

}


/* =====================================================
   التكبير
===================================================== */

function zoomIn(){

    if(!pdfDocument){

        return;

    }


    currentScale += .15;


    if(currentScale > 3){

        currentScale = 3;

    }


    renderPage();

}


function zoomOut(){

    if(!pdfDocument){

        return;

    }


    currentScale -= .15;


    if(currentScale < .5){

        currentScale = .5;

    }


    renderPage();

}


function resetZoom(){

    if(!pdfDocument){

        return;

    }


    currentScale = 1;

    renderPage();

}


/* =====================================================
   معلومات الجملة
===================================================== */

function updateSentenceInfo(){

    const number =
    currentSentence >= 0
    ? currentSentence + 1
    : 0;


    document.getElementById(
        "sentenceInfo"
    ).textContent =
    "جملة " +
    number +
    " / " +
    sentences.length;

}


/* =====================================================
   إنشاء اتصال التلفزيون
===================================================== */

if(!isControlMode){

    const tvCode =
    String(
        Math.floor(
            100000 +
            Math.random()*900000
        )
    );


    const peer =
    new Peer(tvCode,{
        debug:0
    });


    peer.on(
        "open",
        function(id){

            document.getElementById(
                "connectionStatus"
            ).textContent =
            "كود التلفزيون: " + id;

        }
    );


    peer.on(
        "connection",
        function(conn){

            window.tvConnection =
            conn;


            conn.on(
                "open",
                function(){

                    document.getElementById(
                        "connectionStatus"
                    ).textContent =
                    "📱 الهاتف متصل ✓";


                    sendState();

                }
            );


            conn.on(
                "data",
                function(data){

                    receiveCommand(data);

                }
            );


            conn.on(
                "close",
                function(){

                    document.getElementById(
                        "connectionStatus"
                    ).textContent =
                    "كود التلفزيون: " +
                    tvCode;

                }
            );

        }
    );

}


/* =====================================================
   استقبال أوامر الهاتف
===================================================== */

function receiveCommand(data){

    if(!data){

        return;

    }


    switch(data.command){

        case "nextSentence":

            nextSentence();

            break;


        case "previousSentence":

            previousSentence();

            break;


        case "nextPage":

            nextPage();

            break;


        case "previousPage":

            previousPage();

            break;


        case "hideSentence":

            hideSentence();

            break;


        case "zoomIn":

            zoomIn();

            break;


        case "zoomOut":

            zoomOut();

            break;


        case "resetZoom":

            resetZoom();

            break;

    }

}


/* =====================================================
   إرسال حالة العرض للهاتف
===================================================== */

function sendState(){

    if(
        window.tvConnection &&
        window.tvConnection.open
    ){

        window.tvConnection.send({

            type:"state",

            page:currentPage,

            sentence:
            currentSentence >= 0
            ? currentSentence+1
            : 0,

            total:
            sentences.length

        });

    }

}


/* =====================================================
   قسم التحكم
===================================================== */

if(isControlMode){

    let remotePeer = null;

    let remoteConnection = null;


    document.getElementById(
        "connectButton"
    ).onclick = function(){

        const code =
        document.getElementById(
            "tvCode"
        ).value.trim();


        if(!/^\d{6}$/.test(code)){

            document.getElementById(
                "controlStatus"
            ).textContent =
            "❌ اكتب كود التلفزيون المكون من 6 أرقام.";

            return;

        }


        document.getElementById(
            "controlStatus"
        ).textContent =
        "جاري الاتصال...";


        remotePeer =
        new Peer();


        remotePeer.on(
            "open",
            function(){

                remoteConnection =
                remotePeer.connect(
                    code,
                    {
                        reliable:true
                    }
                );


                remoteConnection.on(
                    "open",
                    function(){

                        document.getElementById(
                            "controlStatus"
                        ).textContent =
                        "🟢 متصل بالتلفزيون";


                        document.getElementById(
                            "controls"
                        ).classList.remove(
                            "hidden"
                        );

                    }
                );


                remoteConnection.on(
                    "data",
                    function(data){

                        if(
                            data &&
                            data.type === "state"
                        ){

                            document.getElementById(
                                "remotePage"
                            ).textContent =
                            data.page;


                            document.getElementById(
                                "remoteSentence"
                            ).textContent =
                            data.sentence +
                            " / " +
                            data.total;

                        }

                    }
                );


                remoteConnection.on(
                    "close",
                    function(){

                        document.getElementById(
                            "controlStatus"
                        ).textContent =
                        "🔴 انقطع الاتصال.";

                    }
                );

            }
        );


        remotePeer.on(
            "error",
            function(){

                document.getElementById(
                    "controlStatus"
                ).textContent =
                "❌ فشل الاتصال. تأكد من كود التلفزيون.";

            }
        );

    };


    function sendCommand(command){

        if(
            remoteConnection &&
            remoteConnection.open
        ){

            remoteConnection.send({

                command:command

            });

        }

    }


    document.getElementById(
        "nextSentence"
    ).onclick = function(){

        sendCommand(
            "nextSentence"
        );

    };


    document.getElementById(
        "previousSentence"
    ).onclick = function(){

        sendCommand(
            "previousSentence"
        );

    };


    document.getElementById(
        "nextPage"
    ).onclick = function(){

        sendCommand(
            "nextPage"
        );

    };


    document.getElementById(
        "previousPage"
    ).onclick = function(){

        sendCommand(
            "previousPage"
        );

    };


    document.getElementById(
        "hideSentence"
    ).onclick = function(){

        sendCommand(
            "hideSentence"
        );

    };


    document.getElementById(
        "zoomIn"
    ).onclick = function(){

        sendCommand(
            "zoomIn"
        );

    };


    document.getElementById(
        "zoomOut"
    ).onclick = function(){

        sendCommand(
            "zoomOut"
        );

    };


    document.getElementById(
        "resetZoom"
    ).onclick = function(){

        sendCommand(
            "resetZoom"
        );

    };

}

</script>

</body>
</html>
