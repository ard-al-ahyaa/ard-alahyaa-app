<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أرض الأحياء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2f8f5b;--gd:#1d6a42;--b:#2b6f8e;--ink:#0f1d17;--mut:#667a71;--bg:#edf4f1;--side:#111c17}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,Tajawal,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--side);color:#cfe0d7;padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{background:linear-gradient(135deg,var(--g),var(--b));color:#fff;border-radius:18px;padding:18px;text-align:center;margin-bottom:12px}
.brand b{display:block;font-size:1.1rem}
aside a{padding:11px 14px;border-radius:12px;cursor:pointer;display:flex;gap:10px}
aside a.on{background:#24332c;color:#fff}
aside .out{margin-top:auto;color:#e9a3a3}
main{padding:20px;width:100%;max-width:1100px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.top input{flex:1;border:0;border-radius:99px;padding:12px 18px;background:#dce8e3;min-width:0}
#menu{display:none;background:#fff;border:0;border-radius:12px;padding:8px 12px;font-size:1.2rem}
.btn{background:var(--g);color:#fff;border:0;border-radius:99px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--b)}
h2{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:16px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 10px #0f1d170f}
.big{font-size:2.4rem;font-weight:800;color:var(--gd)}
.mut{color:var(--mut);font-size:.9rem}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px}
.bars div{flex:1;text-align:center;font-size:.8rem}
.bars i{display:block;background:var(--g);border-radius:8px;margin:4px auto 0}
.act{padding:12px 14px;border-radius:14px;background:var(--g);color:#fff;margin-bottom:10px}
.act.dark{background:var(--ink)}
.act small{display:block;opacity:.85}
.hero{display:flex;gap:16px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--b));display:grid;place-items:center;font-size:2rem;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e4ede9}
.item:last-child{border:0}
.ok{color:var(--g);font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:right;border-bottom:1px solid #e4ede9}
.wrap{overflow-x:auto}
.q{margin-bottom:18px}
.q label{display:block;padding:8px 12px;margin-top:6px;border-radius:10px;background:#eff6f3;cursor:pointer}
.q label.right{background:#cdeedb}.q label.wrong{background:#f6d4d4}
textarea,.auth input{width:100%;border:1px solid #cfdcd6;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.auth{max-width:420px;margin:6vh auto;padding:28px}
.auth h1{text-align:center;margin-bottom:16px}
.auth a{display:block;text-align:center;margin-top:12px;color:var(--b);cursor:pointer}
#err{color:#c0392b;min-height:1.4em;margin-bottom:6px}
@media(max-width:820px){
 .shell{grid-template-columns:1fr}
 aside{position:fixed;top:0;right:0;width:250px;transform:translateX(100%);transition:transform .25s;z-index:9}
 aside.open{transform:none}
 #menu{display:block}
 .cols{grid-template-columns:1fr}
 main{padding:14px}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const NAV = [['dash','لوحة التحكم','🏠'],['lec','المحاضرات','🎞️'],['notes','المذكرات','📄'],['exam','الاختبارات','📝'],
  ['hero','بطل الفصل','🏆'],['circ','حلقات قلها أنت','💬'],['res','نتائج الطالب','📊']];
let T = localStorage.getItem('t'), ME = null, view = 'dash', Q = '';

async function api(p, body) {
  const r = await fetch('/api/' + p, { method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: T || '' }, body: body && JSON.stringify(body) });
  const d = await r.json();
  if (r.status === 401 && T) { logout(); }
  if (!r.ok) throw new Error(d.error || 'حدث خطأ');
  return d;
}
function logout() { localStorage.removeItem('t'); T = null; authUI(); }

/* ---------- Auth ---------- */
function authUI(mode = 'in') {
  const up = mode === 'up';
  $('#app').innerHTML = `<div class="auth card"><h1>🧬 أرض الأحياء</h1>
  <form id="f">${up ? `<input name="studentName" placeholder="اسم الطالب الثلاثي" required>
    <input name="parentName" placeholder="اسم ولي الأمر" required>
    <input name="parentPhone" inputmode="numeric" placeholder="رقم هاتف ولي الأمر" required>` : ''}
  <input name="studentPhone" inputmode="numeric" placeholder="رقم هاتف الطالب" required>
  <input name="password" type="password" minlength="6" placeholder="كلمة المرور" required>
  <p id="err"></p><button class="btn" style="width:100%">${up ? 'إنشاء حساب' : 'تسجيل الدخول'}</button></form>
  <a onclick="authUI('${up ? 'in' : 'up'}')">${up ? 'لديك حساب؟ سجّل الدخول' : 'ليس لديك حساب؟ أنشئ حساباً'}</a></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try { const d = await api(up ? 'signup' : 'login', Object.fromEntries(new FormData(e.target)));
      T = d.token; localStorage.setItem('t', T); boot(); }
    catch (x) { $('#err').textContent = x.message; }
  };
}

/* ---------- Shell ---------- */
async function boot() {
  if (!T) return authUI();
  try { ME = await api('me'); } catch { return authUI(); }
  $('#app').innerHTML = `<div class="shell"><aside id="side">
    <div class="brand"><div style="font-size:2rem">📖🧬</div><b>منصة أرض الأحياء</b><small>${esc(ME.studentName)}</small></div>
    ${NAV.map(n => `<a data-v="${n[0]}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</a>`).join('')}
    <a class="out" onclick="logout()">🚪 تسجيل الخروج</a></aside>
    <main><div class="top"><button id="menu" onclick="$('#side').classList.toggle('open')">☰</button>
    <input id="q" placeholder="ابحث عن محاضرة أو مذكرة" oninput="Q=this.value;go(view=='notes'?'notes':'lec')">
    <h2 style="margin:0">🧬 أرض الأحياء</h2></div><div id="v"></div></main></div>`;
  go('dash');
}
async function go(v) {
  view = v; $('#side').classList.remove('open');
  document.querySelectorAll('aside a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  try { $('#v').innerHTML = await VIEWS[v](); } catch (e) { $('#v').innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}
async function mark(itemId, type, url) {
  await api('progress', { itemId, type });
  if (url) window.open(url, '_blank', 'noopener');
  go(view);
}

/* ---------- Views ---------- */
const heroCard = h => h ? `<div class="hero"><div class="avatar">🏅</div><div><b>${esc(h.name)}</b>
  <p class="mut">متوسط ${h.pct}% في ${h.exams} اختبار هذا الأسبوع</p></div></div>`
  : `<p class="mut">لا توجد نتائج هذا الأسبوع. أدِّ اختباراً لتكون أول بطل!</p>`;

const VIEWS = {
  async dash() {
    const d = await api('dashboard'), max = Math.max(1, ...d.chart.map(c => c.value));
    return `<h2>أهلاً، ${esc(ME.studentName.split(' ')[0])}</h2>
    <div class="grid">
      <div class="card"><span class="mut">محاضرات جديدة</span><div class="big">${d.newLectures}</div><span class="mut">هذا الأسبوع</span></div>
      <div class="card"><span class="mut">طلاب نشطون</span><div class="big">${d.active}</div><span class="mut">في آخر 24 ساعة</span></div>
      <div class="card"><span class="mut">اختبارات قادمة</span><div class="big">${d.upcomingExams}</div><span class="mut">خلال الأسبوعين القادمين</span></div>
    </div>
    <div class="cols"><div>
      <div class="card" style="margin-bottom:16px"><h2>تفاعل الطلاب</h2><div class="bars">
        ${d.chart.map(c => `<div>${c.value}<i style="height:${Math.max(8, c.value / max * 130)}px"></i>${c.label}</div>`).join('')}</div></div>
      <div class="card"><h2>بطل الفصل</h2>${heroCard(d.hero)}</div></div>
      <div class="card"><h2>الأنشطة القادمة</h2>
        ${d.activities.map(a => `<div class="act ${a.dark ? 'dark' : ''}">${esc(a.t)}<small>${esc(a.s)}</small></div>`).join('')}</div>
    </div>`;
  },
  async lec() {
    const us = await api('lectures'), q = Q.trim();
    return us.map(u => { const it = u.items.filter(i => i.title.includes(q)); return it.length ? `<div class="card" style="margin-bottom:16px">
      <h2>${esc(u.unit)}</h2>${it.map(i => `<div class="item"><span>🎞️ ${esc(i.title)}</span>
      <span>${i.done ? '<span class="ok">✔ تمت المشاهدة</span> ' : ''}<button class="btn" onclick="mark('${i.id}','lecture','${esc(i.url)}')">شاهد</button></span></div>`).join('')}</div>` : ''; }).join('')
      || '<div class="card">لا توجد نتائج مطابقة.</div>';
  },
  async notes() {
    const ns = (await api('notes')).filter(n => n.title.includes(Q.trim()));
    return `<div class="card"><h2>المذكرات والملخصات</h2>${ns.map(n => `<div class="item"><span>📄 ${esc(n.title)}</span>
      <span>${n.done ? '<span class="ok">✔ تم التحميل</span> ' : ''}<a class="btn alt" href="${esc(n.file)}" download
      onclick="mark('${n.id}','note')" style="text-decoration:none">تحميل PDF</a></span></div>`).join('') || 'لا توجد نتائج مطابقة.'}</div>`;
  },
  async exam() {
    const es = await api('exams');
    return `<div class="card"><h2>الاختبارات</h2>${es.map(e => `<div class="item"><span>📝 ${esc(e.name)}
      <small class="mut">(${e.count} أسئلة)</small></span><button class="btn" onclick="startExam('${e.id}')">ابدأ</button></div>`).join('')}</div>`;
  },
  async hero() {
    return `<div class="card"><h2>🏆 لوحة الشرف</h2>${heroCard((await api('hero')).name ? await api('hero') : null)}</div>`;
  },
  async circ() {
    const ps = await api('posts');
    return `<div class="card" style="margin-bottom:16px"><h2>قلها أنت</h2>
      <textarea id="pt" rows="3" maxlength="500" placeholder="اشرح فكرة أو اطرح سؤالاً للمراجعة"></textarea>
      <button class="btn" onclick="post()">نشر</button></div>
      <div class="card">${ps.map(p => `<div class="item" style="display:block"><b>${esc(p.author)}</b>
      <small class="mut"> ${new Date(p.at).toLocaleString('ar-EG')}</small><p>${esc(p.text)}</p></div>`).join('') || 'لا توجد مشاركات بعد. ابدأ النقاش!'}</div>`;
  },
  async res() {
    const r = await api('results');
    return `<div class="grid">
      <div class="card"><span class="mut">المتوسط العام</span><div class="big">${r.avg}%</div><span class="mut">المستوى: ${r.level}</span></div>
      <div class="card"><span class="mut">المحاضرات المشاهدة</span><div class="big">${r.watched}/${r.totalLectures}</div></div>
      <div class="card"><span class="mut">المذكرات المحمّلة</span><div class="big">${r.downloaded}/${r.totalNotes}</div></div></div>
      <div class="card" style="margin-bottom:16px"><h2>متابعة ولي الأمر</h2>
        <p>${esc(ME.parentName)} — <span dir="ltr">${esc(ME.parentPhone)}</span></p></div>
      <div class="card wrap"><h2>سجل الاختبارات</h2>${r.rows.length ? `<table><tr><th>الاختبار</th><th>الدرجة</th><th>التاريخ</th><th>التقييم</th></tr>
      ${r.rows.map(x => `<tr><td>${esc(x.examName)}</td><td>${x.score}/${x.total}</td><td>${new Date(x.date).toLocaleDateString('ar-EG')}</td><td>${esc(x.evaluation)}</td></tr>`).join('')}</table>` : 'لم تؤدِّ أي اختبار بعد.'}</div>`;
  },
};

/* ---------- Exam + discussion actions ---------- */
async function startExam(id) {
  const e = await api('exam/' + id);
  $('#v').innerHTML = `<div class="card"><h2>${esc(e.name)}</h2><form id="qf">${e.q.map((q, i) => `<div class="q"><b>${i + 1}. ${esc(q.t)}</b>
    ${q.o.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}" required> ${esc(o)}</label>`).join('')}</div>`).join('')}
    <button class="btn">تسليم الإجابات</button></form></div>`;
  $('#qf').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), answers = e.q.map((_, i) => +fd.get('q' + i));
    const r = await api(`exam/${id}/submit`, { answers });
    document.querySelectorAll('.q').forEach((box, i) => {
      box.querySelectorAll('label').forEach((l, j) => {
        if (j === r.correct[i]) l.classList.add('right'); else if (j === answers[i]) l.classList.add('wrong');
      });
    });
    ev.target.querySelector('button').outerHTML = `<h2>نتيجتك: ${r.score}/${r.total} (${r.pct}%) — ${r.evaluation}</h2>
      <button type="button" class="btn alt" onclick="go('exam')">العودة للاختبارات</button>`;
  };
}
async function post() {
  const text = $('#pt').value;
  try { await api('posts', { text }); go('circ'); } catch (e) { alert(e.message); }
}
boot();
</script>
</body>
</html>
