<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameX | تحميل ألعاب الكمبيوتر مجانًا</title>
  <meta name="description" content="حمّل أحدث ألعاب الكمبيوتر بروابط مباشرة وتصنيفات واضحة.">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar"></div>

  <header class="topbar">
    <a href="index.html" class="logo">Game<span>X</span></a>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="#games">الألعاب</a>
      <a href="#categories">التصنيفات</a>
    </nav>
    <input id="search" type="search" placeholder="ابحث عن لعبة..." autocomplete="off">
  </header>

  <section class="hero">
    <h1>حمّل أحدث ألعاب الكمبيوتر</h1>
    <p>روابط مباشرة، تحديثات مستمرة، وتصنيفات واضحة.</p>
  </section>

  <main>
    <div class="filters" id="categories"></div>
    <section id="games" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>لا توجد نتائج مطابقة</p>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="close" id="closeModal" aria-label="إغلاق">&times;</button>
      <img id="m-img" src="" alt="">
      <div class="modal-body">
        <span class="badge" id="m-cat"></span>
        <h2 id="m-title"></h2>
        <p id="m-desc"></p>
        <h4>روابط التحميل</h4>
        <div id="m-links" class="links"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; <span id="year"></span> GameX. جميع الحقوق محفوظة.</p>
  </footer>

  <script src="progress.js"></script>
  <script src="script.js"></script>
</body>
</html>
